<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0C900">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sklad">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html{ color-scheme: light dark; }
  html,body{ min-height:100%; }
  body{ margin:0; font-size:14px; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
<title>Sklad Letostav</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F7F4EC; --surface:#FFFFFF; --surface-2:#FBF8F0; --text:#211F20; --text-muted:#77726C;
    --border:#E9E3D2; --accent:#F0C900; --accent-ink:#201F23; --accent-soft:#FBF0BE; --accent-text:#8A6600;
    --ok-bg:#E3EEE0; --ok-ink:#2F6B34; --warn-bg:#FBEEDA; --warn-ink:#93600F; --crit-bg:#FBE3DF; --crit-ink:#A23324;
    --shadow: 0 1px 2px rgba(34,29,21,.06), 0 4px 16px rgba(34,29,21,.06);
    --nav-h: 64px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#19181A; --surface:#232225; --surface-2:#2A292C; --text:#F2EFE7; --text-muted:#AEA89C;
      --border:#38373A; --accent:#E3BE00; --accent-ink:#1A1912; --accent-soft:#3D3A1C; --accent-text:#E3BE00;
      --ok-bg:#213A26; --ok-ink:#8FD79A; --warn-bg:#3D2E0F; --warn-ink:#E3B45C; --crit-bg:#3E201B; --crit-ink:#F0897A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#19181A; --surface:#232225; --surface-2:#2A292C; --text:#F2EFE7; --text-muted:#AEA89C;
    --border:#38373A; --accent:#E3BE00; --accent-ink:#1A1912; --accent-soft:#3D3A1C; --accent-text:#E3BE00;
    --ok-bg:#213A26; --ok-ink:#8FD79A; --warn-bg:#3D2E0F; --warn-ink:#E3B45C; --crit-bg:#3E201B; --crit-ink:#F0897A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); font-family:"Public Sans",system-ui,sans-serif; }
  h1,h2,h3,.display{ font-family:"Archivo",system-ui,sans-serif; font-weight:800; letter-spacing:-.01em; text-wrap:balance; }
  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; font-size:16px; }
  a{ color:inherit; }

  #app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  /* ---------- Gate screens (PIN / person) ---------- */
  .gate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 20px; gap:22px; text-align:center; }
  .gate-logo{ width:200px; max-width:70vw; height:auto; border-radius:12px; box-shadow:var(--shadow); }
  .gate h1{ font-size:22px; margin:0; }
  .gate p{ color:var(--text-muted); margin:0; max-width:320px; font-size:14px; line-height:1.5; }
  .pin-dots{ display:flex; gap:12px; }
  .pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background:transparent; transition:background .1s, border-color .1s; }
  .pin-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:12px; }
  .key{ width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:20px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .key:active{ background:var(--surface-2); }
  .key.ghost{ border-color:transparent; background:transparent; color:var(--text-muted); font-size:14px; }
  .gate-error{ color:var(--crit-ink); font-size:13px; min-height:18px; }
  .person-list{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px; }
  .person-btn{ padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-weight:600; text-align:left; display:flex; align-items:center; gap:10px; }
  .person-avatar{ width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent-text); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; }
  .newperson-row{ display:flex; gap:8px; width:100%; max-width:320px; }
  .newperson-row input{ flex:1; }

  /* ---------- shell ---------- */
  #topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:10px; }
  .brand{ display:flex; align-items:center; gap:9px; flex:1; min-width:0; }
  .brand-logo{ height:26px; width:auto; border-radius:6px; flex:none; box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .brand-name{ font-family:"Archivo",sans-serif; font-weight:800; font-size:15px; line-height:1.1; }
  .brand-sub{ font-size:11px; color:var(--text-muted); }
  #personChip{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:5px 10px 5px 6px; font-size:12.5px; font-weight:600; flex:none; }
  #gearBtn.admin{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  #personChip .person-avatar{ width:20px; height:20px; font-size:10px; }
  #gearBtn{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); flex:none; display:flex; align-items:center; justify-content:center; font-size:15px; }

  #banner{ margin:10px 16px 0; background:var(--warn-bg); color:var(--warn-ink); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.5; display:flex; gap:8px; align-items:flex-start; }
  #banner button{ background:none; border:none; color:inherit; font-weight:700; font-size:13px; flex:none; margin-left:auto; padding:0 0 0 6px; }

  #viewport{ flex:1; padding:14px 16px calc(var(--nav-h) + 28px); display:flex; flex-direction:column; gap:16px; }

  #bottomnav{ position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--border); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); }
  .navwrap{ max-width:640px; margin:0 auto; display:flex; width:100%; }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px; background:none; border:none; color:var(--text-muted); font-size:10.5px; font-weight:600; }
  .navbtn .ic{ font-size:19px; }
  .navbtn.active{ color:var(--accent-text); }

  /* ---------- generic ui ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .section-head h2{ font-size:16px; margin:0; }
  .section-head .count{ font-size:12px; color:var(--text-muted); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); }
  .pad{ padding:14px; }
  .stat-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
  .stat .num{ font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; }
  .stat .lbl{ font-size:11.5px; color:var(--text-muted); font-weight:600; }
  .stat.warn .num{ color:var(--warn-ink); } .stat.crit .num{ color:var(--crit-ink); }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .row-item{ width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:11px 12px; display:flex; align-items:center; gap:10px; }
  .row-item .ricon{ width:36px; height:36px; border-radius:10px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-weight:700; font-size:14.5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .row-sub{ font-size:12px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-end{ text-align:right; flex:none; }
  .row-qty{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:14.5px; }
  .pips{ display:flex; gap:3px; justify-content:flex-end; margin-bottom:2px; }
  .pip{ width:9px; height:14px; border-radius:3px; background:var(--ok-ink); }
  .pip.out{ background:transparent; border:2px solid var(--text-muted); opacity:.55; }
  .pip.over{ border-color:var(--warn-ink); opacity:1; }
  .piece{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .piece:last-child{ border-bottom:none; }
  .piece-main{ flex:1; min-width:0; }
  .piece-label{ font-weight:700; font-size:14px; }
  .piece-status{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; margin-top:3px; }
  .badge.ok{ background:var(--ok-bg); color:var(--ok-ink); }
  .badge.warn{ background:var(--warn-bg); color:var(--warn-ink); }
  .badge.crit{ background:var(--crit-bg); color:var(--crit-ink); }
  .badge.neutral{ background:var(--surface-2); color:var(--text-muted); }

  .search{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 12px; }
  .search input{ border:none; background:none; outline:none; color:var(--text); flex:1; font-size:14.5px; }
  .search .ic{ color:var(--text-muted); font-size:14px; }

  .chip-row{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; }
  .chip{ flex:none; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .fab-row{ display:flex; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:11px; padding:11px 16px; font-size:14px; font-weight:700; border:1px solid transparent; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--text); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:12.5px; border-radius:9px; }
  .btn-ghost{ background:none; border:none; color:var(--accent-text); font-weight:700; font-size:13px; padding:4px 2px; }
  .btn-danger{ background:var(--crit-bg); color:var(--crit-ink); }

  .empty{ text-align:center; padding:30px 10px; color:var(--text-muted); font-size:13px; }
  .hist-entry{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .hist-entry:last-child{ border-bottom:none; }
  .hist-dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
  .hist-body{ flex:1; min-width:0; }
  .hist-title{ font-size:13.5px; font-weight:600; }
  .hist-meta{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

  /* ---------- modal ---------- */
  #modalRoot{ position:fixed; inset:0; z-index:50; display:none; }
  #modalRoot.open{ display:block; }
  .modal-backdrop{ position:absolute; inset:0; background:rgba(20,16,10,.45); }
  .modal-sheet{ position:absolute; left:0; right:0; bottom:0; max-width:640px; margin:0 auto; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px); max-height:88vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.25); }
  .modal-handle{ width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 14px; }
  .modal-title{ font-size:17px; margin:0 0 14px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label{ font-size:12px; font-weight:700; color:var(--text-muted); }
  .field input, .field select, .field textarea{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:10px; padding:10px 12px; outline:none; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions .btn{ flex:1; }
  .seg{ display:flex; border:1px solid var(--border); border-radius:11px; overflow:hidden; }
  .seg button{ flex:1; padding:10px; background:var(--surface-2); color:var(--text-muted); font-weight:700; font-size:13px; border:none; }
  .seg button.active{ background:var(--accent); color:var(--accent-ink); }
  .hint{ font-size:11.5px; color:var(--text-muted); margin:-6px 0 12px; }

  .navbtn.scanbtn{ flex:1.15; }
  .scan-ic{ width:44px; height:44px; margin-top:-22px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(0,0,0,.25); border:3px solid var(--surface); }
  .scan-ic svg{ width:22px; height:22px; }
  #scanner{ position:fixed; inset:0; z-index:60; background:#0E0D0F; color:#F2EFE7; display:flex; flex-direction:column; }
  #scanner .sc-top{ display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px; }
  #scanner .sc-title{ font-family:"Archivo",sans-serif; font-weight:800; font-size:17px; }
  #scanner .sc-close{ background:rgba(255,255,255,.12); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:14px; }
  #scanner .sc-stage{ position:relative; flex:1; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #scanner video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #scanner .sc-frame{ position:relative; width:64vmin; height:64vmin; max-width:300px; max-height:300px; border-radius:22px; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); border:3px solid #F0C900; }
  #scanner .sc-msg{ position:absolute; left:16px; right:16px; bottom:18px; text-align:center; font-size:14px; line-height:1.45; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #scanner .sc-msg.err{ background:rgba(0,0,0,.6); border-radius:12px; padding:12px; text-shadow:none; }
  #scanner .sc-bottom{ padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; gap:10px; background:#0E0D0F; }
  #scanner .sc-bottom input{ flex:1; min-width:0; border-radius:11px; border:1px solid #3A393C; background:#1C1B1E; color:#fff; padding:11px 12px; font-size:16px; }
  #scanner[hidden], #toast[hidden]{ display:none !important; }
  #toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px); transform:translateX(-50%); z-index:70; background:var(--text); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:13.5px; font-weight:600; width:max-content; max-width:calc(100vw - 32px); text-align:center; box-shadow:var(--shadow); }
  ::selection{ background:var(--accent-soft); }
</style>

</head>
<body>
<div id="app">
  <div id="gateHost"></div>
  <div id="shellHost" style="display:none; flex-direction:column; flex:1;">
    <div id="banner" style="display:none;"></div>
    <div id="topbar"></div>
    <div id="viewport"></div>
    <div id="bottomnav">
      <div class="navwrap">
        <button class="navbtn" data-view="prehled"><span class="ic">◆</span>Přehled</button>
        <button class="navbtn" data-view="material"><span class="ic">▦</span>Materiál</button>
        <button class="navbtn scanbtn" id="scanNavBtn" aria-label="Skenovat QR kód"><span class="scan-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span>Skenovat</button>
        <button class="navbtn" data-view="naradi"><span class="ic">⚒</span>Nářadí</button>
        <button class="navbtn" data-view="historie"><span class="ic">≡</span>Historie</button>
      </div>
    </div>
  </div>
</div>
<div id="scanner" hidden>
  <div class="sc-top"><div class="sc-title">Naskenuj QR kód nářadí</div><button class="sc-close" id="scClose">Zavřít</button></div>
  <div class="sc-stage"><video id="scVideo" playsinline muted></video><div class="sc-frame"></div><div class="sc-msg" id="scMsg">Namiř kameru na QR kód na nářadí.</div></div>
  <div class="sc-bottom"><input id="scManual" inputmode="numeric" placeholder="nebo zadej číslo z QR kódu"><button class="btn btn-primary" id="scManualBtn">Najít</button></div>
</div>
<div id="toast" hidden></div>
<div id="modalRoot"><div class="modal-backdrop" onclick="closeModal()"></div><div class="modal-sheet" id="modalSheet"></div></div>

<script>

function uid(prefix){ return (prefix||"id") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }

function loadDevice(){
  try{ var raw = localStorage.getItem(DEVICE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { unlocked:false, personName:null, admin:false };
}
function saveDevice(){ try{ localStorage.setItem(DEVICE_KEY, JSON.stringify(device)); }catch(e){} }

var state = { items:[], tools:[], stavby:[], people:[], movements:[], toolLog:[], settings:{ alertDays:14 } };
var device = loadDevice();
var activeView = "prehled";
var pinBuffer = "";
var pinBusy = false;
var pinMsg = "";
var materialFilter = "";
var materialSklad = "senik";
var materialCat = "vse";
var toolFilter = "";
var toolCat = "vse";
var historyTab = "vse";

/* ---------------- Firebase ---------------- */
var fb = null;            // { db, auth, uid }
var F = null;             // firestore module
var conn = "loading";     // loading | ready | error
var connError = "";
var initialized = null;   // null = neznámo, true/false po načtení public/status
var subs = [];
var loaded = {};
var LOAD_KEYS = ["items","tools","stavby","people","config"];
function allLoaded(){ return LOAD_KEYS.every(function(k){ return loaded[k]; }); }
function dref(path){ return F.doc(fb.db, path); }
function cref(path){ return F.collection(fb.db, path); }
function slug(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || ("x"+Date.now()); }
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej({code:"timeout"}); }, ms||15000); })]);
}
function errText(e){
  var c = e && e.code || "";
  if(c==="permission-denied" || c==="firestore/permission-denied") return "Na tuhle akci nemáš oprávnění.";
  if(c==="timeout" || c==="unavailable") return "Nejde se připojit k internetu. Zkus to znovu.";
  return "Něco se nepovedlo ("+(c||"chyba")+"). Zkus to znovu.";
}
function isDenied(e){ var c = e && e.code || ""; return c==="permission-denied" || c==="firestore/permission-denied"; }

var renderQueued = false;
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function(){ renderQueued = false; render(); });
}

async function initFirebase(){
  try{
    var appM = await import(FB_BASE + "firebase-app.js");
    var authM = await import(FB_BASE + "firebase-auth.js");
    F = await import(FB_BASE + "firebase-firestore.js");
    var app = appM.initializeApp(FIREBASE_CONFIG);
    var db;
    try{ db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
    catch(e){ db = F.getFirestore(app); }
    var auth = authM.getAuth(app);
    await auth.authStateReady();
    if(!auth.currentUser) await withTimeout(authM.signInAnonymously(auth), 20000);
    fb = { db:db, auth:auth, uid:auth.currentUser.uid };
    conn = "ready";
    if(device.unlocked) startSync(); else await checkInitialized();
  }catch(e){
    conn = "error"; connError = errText(e);
    try{ console.error(e); }catch(_){}
  }
  render();
}
async function checkInitialized(){
  try{
    var s = await withTimeout(F.getDoc(dref("public/status")), 15000);
    initialized = s.exists();
  }catch(e){ initialized = null; conn = "error"; connError = errText(e); }
}

function mapDocs(snap){ return snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }); }
function startSync(){
  stopSync();
  var onErr = function(e){
    if(isDenied(e)){ lockOut("Přístupový kód se změnil. Zadej nový kód."); return; }
    toast(errText(e));
  };
  subs.push(F.onSnapshot(cref("items"), function(s){ state.items = mapDocs(s).sort(function(a,b){ return String(a.order||a.id).localeCompare(String(b.order||b.id),"cs",{numeric:true}); }); loaded.items = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(cref("tools"), function(s){ state.tools = mapDocs(s); loaded.tools = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(cref("stavby"), function(s){ state.stavby = mapDocs(s); loaded.stavby = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(cref("people"), function(s){ state.people = mapDocs(s).map(function(p){ return p.name; }).filter(Boolean).sort(function(a,b){ return a.localeCompare(b,"cs"); }); loaded.people = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(dref("config/settings"), function(s){ var d = s.exists()? s.data() : {}; state.settings.alertDays = d.alertDays || 14; loaded.config = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(F.query(cref("movements"), F.orderBy("ts","desc"), F.limit(400)), function(s){ state.movements = mapDocs(s); loaded.movements = true; scheduleRender(); }, onErr));
  subs.push(F.onSnapshot(F.query(cref("toolLog"), F.orderBy("ts","desc"), F.limit(400)), function(s){ state.toolLog = mapDocs(s); loaded.toolLog = true; scheduleRender(); }, onErr));
}
function stopSync(){ subs.forEach(function(u){ try{ u(); }catch(e){} }); subs = []; loaded = {}; }
function lockOut(msg){
  stopSync();
  device.unlocked = false; device.admin = false; saveDevice();
  pinMsg = msg || ""; pinBuffer = "";
  closeModal(); closeScanner && closeScanner();
  checkInitialized().then(render);
  render();
}
async function tryPin(pin){
  await withTimeout(F.setDoc(dref("members/"+fb.uid), { pin: pin, at: F.serverTimestamp() }), 15000);
}
async function tryAdmin(code){
  await withTimeout(F.setDoc(dref("admins/"+fb.uid), { adminPin: code, at: F.serverTimestamp() }), 15000);
}
function adminFail(e){
  if(isDenied(e)){ device.admin = false; saveDevice(); render(); toast("Režim správce vypršel (kód správce se změnil). Odemkni ho znovu."); }
  else toast(errText(e));
}

/* ---- první spuštění: kódy + nahrání dat ---- */
async function runSetup(pin, adminPin, name){
  var b = F.writeBatch(fb.db);
  b.set(dref("secret/app"), { pin: pin, adminPin: adminPin });
  b.set(dref("members/"+fb.uid), { pin: pin, at: F.serverTimestamp() });
  b.set(dref("admins/"+fb.uid), { adminPin: adminPin, at: F.serverTimestamp() });
  try{ await withTimeout(b.commit(), 20000); }
  catch(e){
    if(!isDenied(e)) throw e;
    // appka už kódy má (předchozí nedokončený pokus) – zkus se přihlásit zadanými kódy a pokračovat
    await tryPin(pin); await tryAdmin(adminPin);
  }
  var writes = [];
  writes.push(["config/settings", { alertDays: 14 }]);
  STAVBY_SEED.forEach(function(n, i){ writes.push(["stavby/s"+String(i+1).padStart(2,"0"), { name:n, active:true }]); });
  ["Kancelář","Sklad", name].filter(Boolean).forEach(function(n){ writes.push(["people/"+slug(n), { name:n }]); });
  ITEM_SEED.forEach(function(r, i){ var id = "i"+String(i+1).padStart(3,"0"); writes.push(["items/"+id, { order:id, sklad:"senik", name:r.name, category:r.category, spec:r.spec, unit:r.unit, qty:r.qty, minQty:0, location:"" }]); });
  TOOL_SEED.forEach(function(r){ writes.push(["tools/t"+r[0], { invNo:r[0], category:r[1], name:r[2], status:"in", borrower:null, stavbaId:null, since:null }]); });
  for(var k=0; k<writes.length; k+=15){
    await withTimeout(Promise.all(writes.slice(k, k+15).map(function(w){ return F.setDoc(dref(w[0]), w[1]); })), 30000);
    var el = document.getElementById("setupProgress");
    if(el) el.textContent = "Nahrávám data… " + Math.min(100, Math.round((k+15)/writes.length*100)) + " %";
  }
  await withTimeout(F.setDoc(dref("public/status"), { initialized:true, at:F.serverTimestamp() }), 15000);
  device.unlocked = true; device.admin = true; device.personName = name; saveDevice();
  initialized = true;
  startSync();
}

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function stavbaName(id, fallback){ var s = state.stavby.find(function(x){return x.id===id;}); return s? s.name : (fallback || "—"); }
function itemById(id){ return state.items.find(function(x){return x.id===id;}); }
function toolById(id){ return state.tools.find(function(x){return x.id===id;}); }
function daysAgo(ts){ return Math.floor((now()-ts)/86400000); }
function daysTxt(ts){ var d=daysAgo(ts); return d<=0?"dnes":(d===1?"1 den":(d<5?d+" dny":d+" dní")); }
function fmtDate(ts){
  var d = new Date(ts);
  return d.toLocaleDateString("cs-CZ",{day:"numeric",month:"numeric",year:"numeric"}) + " " + d.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
}
function fmtRel(ts){
  var d = daysAgo(ts);
  if(d<=0) return "dnes";
  if(d===1) return "včera";
  if(d<7) return "před "+d+" dny";
  return fmtDate(ts).split(" ")[0];
}
function initials(name){ if(!name) return "?"; var p=name.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }

/* ---------------- render root ---------------- */
function render(){
  // zachovat fokus v hledání při překreslení z databáze
  var ae = document.activeElement, keepId = null, selS = 0, selE = 0;
  if(ae && ae.id && ae.tagName==="INPUT" && document.getElementById("viewport").contains(ae)){ keepId = ae.id; selS = ae.selectionStart; selE = ae.selectionEnd; }
  if(conn==="loading"){ renderMessageGate("Připojuji se…", ""); return; }
  if(conn==="error"){ renderMessageGate("Nejde se připojit", connError + " Zkontroluj internet a obnov stránku.", true); return; }
  if(!device.unlocked){
    if(initialized===false){ renderSetup(); return; }
    renderGatePin(); return;
  }
  if(!allLoaded()){ renderMessageGate("Načítám sklad…", ""); return; }
  if(!device.personName){ renderGatePerson(); return; }
  document.getElementById("gateHost").innerHTML = "";
  document.getElementById("shellHost").style.display = "flex";
  renderBanner();
  renderTopbar();
  renderView();
  renderNav();
  if(keepId){ var el = document.getElementById(keepId); if(el){ el.focus(); try{ el.setSelectionRange(selS, selE); }catch(e){} } }
}

/* ---------------- PIN gate ---------------- */
function renderGatePin(){
  document.getElementById("shellHost").style.display = "none";
  var dotsHtml = "";
  for(var i=0;i<4;i++){ dotsHtml += '<div class="pin-dot'+(i<pinBuffer.length?" filled":"")+'"></div>'; }
  var keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  var keysHtml = keys.map(function(k){
    if(k==="") return '<div></div>';
    if(k==="⌫") return '<button class="key ghost" data-key="back">⌫</button>';
    return '<button class="key" data-key="'+k+'">'+k+'</button>';
  }).join("");
  document.getElementById("gateHost").innerHTML =
    '<div class="gate">'+
      '<img class="gate-logo" src="'+LOGO_SRC+'" alt="Letostav">'+
      '<div><h1>Sklad</h1><p>Zadej přístupový kód appky. Kód dostaneš od koordinátora, jednou na zařízení, pak už se ptát nebude.</p></div>'+
      '<div class="pin-dots">'+dotsHtml+'</div>'+
      '<div class="gate-error" id="pinErr">'+esc(pinBusy ? "Ověřuji…" : pinMsg)+'</div>'+
      '<div class="keypad">'+keysHtml+'</div>'+
    '</div>';
  document.querySelectorAll("[data-key]").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.getAttribute("data-key");
      if(pinBusy) return;
      if(k==="back"){ pinBuffer = pinBuffer.slice(0,-1); render(); return; }
      if(pinBuffer.length>=4) return;
      pinBuffer += k; pinMsg = "";
      if(pinBuffer.length===4){
        pinBusy = true; render();
        tryPin(pinBuffer).then(function(){
          pinBusy = false; pinBuffer = ""; device.unlocked = true; saveDevice(); startSync(); render();
        }).catch(function(e){
          pinBusy = false; pinBuffer = "";
          pinMsg = isDenied(e) ? "Nesprávný kód, zkus to znovu." : errText(e);
          render();
        });
      } else { render(); }
    });
  });
}

  var overdueTools = state.tools.filter(function(t){ return t.status==="out" && daysAgo(t.since) >= state.settings.alertDays; });
  var outTools = state.tools.filter(function(t){ return t.status==="out"; });

/* ---------------- Materiál ---------------- */
function itemSub(i){ return [i.category, i.spec, i.location].filter(function(x){return x;}).join(" · "); }
function viewMaterial(){
  var q = materialFilter.toLowerCase();
  var inSklad = state.items.filter(function(i){ return (i.sklad||"senik")===materialSklad; });
  var cats = [];
  inSklad.forEach(function(i){ if(i.category && cats.indexOf(i.category)===-1) cats.push(i.category); });
  if(materialCat!=="vse" && cats.indexOf(materialCat)===-1) materialCat = "vse";
  var items = inSklad.filter(function(i){
    return (i.name+" "+(i.spec||"")).toLowerCase().indexOf(q)>-1 && (materialCat==="vse" || i.category===materialCat);
  });
  var rows = items.length ? items.map(function(i){
    var badge = i.qty<=0 ? {c:"crit",t:"Došlo"} : (i.minQty>0 && i.qty<i.minQty ? {c:"warn",t:"Pod min."} : null);
    return rowItem({icon:"▦", title:i.name, sub:itemSub(i), endTop:fmtQty(i.qty)+" "+i.unit, badge:badge&&badge.c, badgeText:badge&&badge.t, onClick:"openItemDetail('"+i.id+"')"});
  }).join("") : (inSklad.length ? '<div class="empty">Nic nenalezeno.</div>'
      : '<div class="empty">'+esc(skladName(materialSklad))+' je zatím prázdný.<br>Položky přidáš tlačítkem výše.</div>');

  var seg = SKLADY.length<2 ? '' : '<div class="seg">'+SKLADY.map(function(s){
    var n = state.items.filter(function(i){ return (i.sklad||"senik")===s.id; }).length;
    return '<button class="'+(materialSklad===s.id?"active":"")+'" data-sklad="'+s.id+'">'+esc(s.name)+' ('+n+')</button>';
  }).join("")+'</div>';
  var chips = cats.length>1 ? '<div class="chip-row"><button class="chip '+(materialCat==="vse"?"active":"")+'" data-mcat="vse">Vše</button>'+
    cats.map(function(c){ return '<button class="chip '+(materialCat===c?"active":"")+'" data-mcat="'+esc(c)+'">'+esc(c)+'</button>'; }).join("")+'</div>' : '';

  return ''+ seg +
  '<div class="search"><span class="ic">🔍</span><input id="materialSearch" placeholder="Hledat materiál…" value="'+esc(materialFilter)+'"></div>'+
  chips +
  (isAdmin()?'':'<!--')+'<button class="btn btn-primary btn-block" id="addItemBtn">+ Přidat položku'+(SKLADY.length>1?' do: '+esc(skladName(materialSklad)):'')+'</button>'+(isAdmin()?'':'-->')+
  '<div class="section-head"><h2>'+esc(skladName(materialSklad))+'</h2><span class="count">'+items.length+' položek</span></div>'+
  '<div class="list">'+rows+'</div>';
}

/* ---------------- Nářadí ---------------- */
function toolLabel(t){ return t.name; }
var toolGroupsCache = [];
function toolParts(name){
  var roman = null, dates = [];
  var n = name.replace(/\s+-\s+(IV|V|I{1,3})(?=\s|$)/, function(m,r){ roman=r; return ""; });
  n = n.replace(/\s*\b\d{1,2}\/\d{2,4}\b/g, function(m){ dates.push(m.trim()); return ""; });
  n = n.replace(/\s+/g," ").trim();
  return { base:n, label: dates.join(" ") + (roman ? (dates.length?" – ":"") + "kus " + roman : "") };
}
function buildToolGroups(){
  var sorted = state.tools.slice().sort(function(a,b){ return String(a.invNo||"").localeCompare(String(b.invNo||""),"cs",{numeric:true}); });
  var map = {}, list = [];
  sorted.forEach(function(t){
    var p = toolParts(t.name), key = p.base.toLowerCase();
    if(!map[key]){ map[key] = {name:p.base, category:t.category, items:[], labels:[]}; list.push(map[key]); }
    map[key].items.push(t); map[key].labels.push(p.label);
  });
  list.forEach(function(g, i){
    g.idx = i;
    var seen = {};
    g.labels = g.labels.map(function(l, j){
      if(!l || seen[l]) l = (l ? l+" – " : "") + "kus "+(j+1);
      seen[l] = true; return l;
    });
  });
  toolGroupsCache = list;
  return list;
}
window.returnTool = async function(id){
  var t = toolById(id); if(!t) return false;
  var ref = dref("tools/"+id);
  var logRef = F.doc(cref("toolLog"));
  try{
    await withTimeout(F.runTransaction(fb.db, async function(tx){
      var s = await tx.get(ref);
      if(!s.exists()) throw { code:"gone" };
      var d = s.data();
      if(d.status!=="out") throw { code:"already-in" };
      tx.update(ref, { status:"in", borrower:null, stavbaId:null, since:null });
      tx.set(logRef, { toolId:id, toolName:d.name, action:"return", personName:device.personName, borrower:d.borrower||"", stavbaId:d.stavbaId||null, stavbaName:stavbaName(d.stavbaId,""), ts:now() });
    }), 20000);
    toast("Vráceno na sklad: "+t.name);
    return true;
  }catch(e){
    if(e && e.code==="already-in") toast("Tohle nářadí už mezitím někdo vrátil.");
    else if(e && e.code==="gone") toast("Tohle nářadí už v appce není.");
    else toast(errText(e));
    return false;
  }
};
window.openGroupDetail = function(idx){
  var g = toolGroupsCache[idx]; if(!g) return;
  var free = g.items.filter(function(t){return t.status==="in";}).length;
  var rows = g.items.map(function(t, j){
    var st = t.status==="in" ? '<span class="badge ok">Na skladě</span>'
      : '<div class="piece-status">'+esc(t.borrower)+' · '+esc(stavbaName(t.stavbaId))+' · '+daysTxt(t.since)+'</div>'+
        '<span class="badge '+(daysAgo(t.since)>=state.settings.alertDays?"warn":"neutral")+'">Půjčeno</span>';
    var btn = t.status==="in" ? '<button class="btn btn-primary btn-sm" data-borrow="'+t.id+'">Půjčit</button>'
      : '<button class="btn btn-outline btn-sm" data-return="'+t.id+'">Vrátit</button>';
    return '<div class="piece"><div class="piece-main"><div class="piece-label">'+esc(g.labels[j])+'</div>'+st+'</div>'+btn+
      (isAdmin()?'<button class="btn-ghost" data-edit="'+t.id+'" aria-label="Upravit">✎</button>':'')+'</div>';
  }).join("");
  openModal(
    '<h3 class="modal-title">'+esc(g.name)+'</h3>'+
    '<div class="hint">'+esc(g.category||"")+' · '+g.items.length+' ks · na skladě '+free+'</div>'+
    '<div class="card pad" style="padding-block:4px;">'+rows+'</div>'
  );
  document.querySelectorAll("[data-borrow]").forEach(function(b){ b.addEventListener("click", function(){ openBorrowModal(b.getAttribute("data-borrow")); }); });
  document.querySelectorAll("[data-return]").forEach(function(b){ b.addEventListener("click", async function(){ b.disabled = true; await returnTool(b.getAttribute("data-return")); render(); openGroupDetail(idx); }); });
  document.querySelectorAll("[data-edit]").forEach(function(b){ b.addEventListener("click", function(){ openEditToolModal(b.getAttribute("data-edit")); }); });
};
function viewNaradi(){
  var q = toolFilter.toLowerCase();
  var cats = [];
  state.tools.forEach(function(t){ if(t.category && cats.indexOf(t.category)===-1) cats.push(t.category); });
  cats.sort(function(a,b){ return a==="Ostatní"?1:(b==="Ostatní"?-1:a.localeCompare(b,"cs")); });
  var groups = buildToolGroups();
  var tools = groups.filter(function(g){
    var hay = (g.name+" "+g.items.map(function(t){return t.name+" "+(t.borrower||"");}).join(" ")).toLowerCase();
    var anyOut = g.items.some(function(t){return t.status==="out";});
    return hay.indexOf(q)>-1 && (toolCat==="vse" || (toolCat==="pujceno" ? anyOut : g.category===toolCat));
  });
  var outCount = state.tools.filter(function(t){return t.status==="out";}).length;
  var rows = tools.length ? tools.map(function(g){
    if(g.items.length===1){
      var t = g.items[0];
      if(t.status==="in") return rowItem({icon:"⚒", title:t.name, sub:(t.category||""), endTop:"", badge:"ok", badgeText:"Na skladě", onClick:"openToolDetail('"+t.id+"')"});
      var over1 = daysAgo(t.since) >= state.settings.alertDays;
      return rowItem({icon:"⚒", title:t.name, sub:t.borrower+" · "+stavbaName(t.stavbaId), endTop:daysTxt(t.since), badge:over1?"warn":"neutral", badgeText:over1?"Přes limit":"Půjčeno", onClick:"openToolDetail('"+t.id+"')"});
    }
    var total = g.items.length;
    var free = g.items.filter(function(t){return t.status==="in";}).length;
    var over = g.items.some(function(t){ return t.status==="out" && daysAgo(t.since)>=state.settings.alertDays; });
    var pips = '<div class="pips" title="'+free+' z '+total+' na skladě">'+g.items.map(function(t){
      var cls = t.status==="in" ? "pip" : ("pip out"+(daysAgo(t.since)>=state.settings.alertDays?" over":""));
      return '<span class="'+cls+'"></span>';
    }).join("")+'</div>';
    var b = over ? {c:"warn",t:"Přes limit"} : (free===total ? {c:"ok",t:"Vše na skladě"} : (free===0 ? {c:"warn",t:"Vše půjčeno"} : {c:"neutral",t:free+" z "+total+" volné"}));
    return rowItem({icon:"⚒", title:g.name, sub:(g.category||"")+" · "+total+" ks", endHtml:pips, badge:b.c, badgeText:b.t, onClick:"openGroupDetail("+g.idx+")"});
  }).join("") : '<div class="empty">Nic nenalezeno.</div>';

  var chips = '<button class="chip '+(toolCat==="vse"?"active":"")+'" data-tcat="vse">Vše</button>'+
    '<button class="chip '+(toolCat==="pujceno"?"active":"")+'" data-tcat="pujceno">Půjčené ('+outCount+')</button>'+
    cats.map(function(c){ return '<button class="chip '+(toolCat===c?"active":"")+'" data-tcat="'+esc(c)+'">'+esc(c)+'</button>'; }).join("");

  return ''+
  '<div class="search"><span class="ic">🔍</span><input id="toolSearch" placeholder="Hledat nářadí…" value="'+esc(toolFilter)+'"></div>'+
  '<div class="chip-row">'+chips+'</div>'+
  (isAdmin()?'<button class="btn btn-primary btn-block" id="addToolBtn">+ Přidat nářadí</button>':'')+
  '<div class="section-head"><h2>Nářadí</h2><span class="count">'+state.tools.length+' ks celkem</span></div>'+
  '<div class="list">'+rows+'</div>';
}

/* ---------------- Historie ---------------- */
function allEvents(){
  var ev = [];
  state.movements.forEach(function(m){
    var it = itemById(m.itemId);
    ev.push({ts:m.ts, kind:"material", type:m.type, title:(m.type==="in"?"Příjem: ":"Výdej: ")+(it?it.name:(m.itemName||"?")),
      meta:fmtQty(m.qty)+" "+(it?it.unit:(m.unit||""))+" · "+m.personName+(m.stavbaId?" · "+stavbaName(m.stavbaId, m.stavbaName):"")+(m.invoiceNo?" · dokl. "+m.invoiceNo:"")});
  });
  state.toolLog.forEach(function(l){
    var t = toolById(l.toolId);
    ev.push({ts:l.ts, kind:"tool", type:l.action, title:(l.action==="borrow"?"Půjčeno: ":"Vráceno: ")+(t?toolLabel(t):(l.toolName||"?")),
      meta:(l.action==="borrow"? (l.borrower+(l.stavbaId?" · "+stavbaName(l.stavbaId, l.stavbaName):"")) : l.personName)});
  });
  ev.sort(function(a,b){ return b.ts-a.ts; });
  return ev;
}
function historyEntryHtml(e){
  var dotColor = e.kind==="material" ? (e.type==="in"?"var(--ok-ink)":"var(--accent)") : (e.type==="borrow"?"var(--warn-ink)":"var(--ok-ink)");
  return '<div class="hist-entry"><div class="hist-dot" style="background:'+dotColor+'"></div>'+
    '<div class="hist-body"><div class="hist-title">'+esc(e.title)+'</div>'+
    '<div class="hist-meta">'+esc(e.meta)+' · '+fmtRel(e.ts)+', '+fmtDate(e.ts).split(" ")[1]+'</div></div></div>';
}
function viewHistorie(){
  var ev = allEvents();
  if(historyTab==="material") ev = ev.filter(function(e){return e.kind==="material";});
  if(historyTab==="naradi") ev = ev.filter(function(e){return e.kind==="tool";});
  var html = ev.length ? ev.map(historyEntryHtml).join("") : '<div class="empty">Zatím žádné záznamy.</div>';
  return ''+
  '<div class="chip-row">'+
    '<button class="chip '+(historyTab==="vse"?"active":"")+'" data-tab="vse">Vše</button>'+
    '<button class="chip '+(historyTab==="material"?"active":"")+'" data-tab="material">Materiál</button>'+
    '<button class="chip '+(historyTab==="naradi"?"active":"")+'" data-tab="naradi">Nářadí</button>'+
  '</div>'+
  '<div class="card pad">'+html+'</div>';
}

/* ---------------- wiring per view ---------------- */
function wireView(){
  var ms = document.getElementById("materialSearch");
  if(ms){ ms.addEventListener("input", function(){ materialFilter = ms.value; renderView(); ms.focus(); ms.selectionStart = ms.selectionEnd = ms.value.length; }); }
  var ts = document.getElementById("toolSearch");
  if(ts){ ts.addEventListener("input", function(){ toolFilter = ts.value; renderView(); ts.focus(); ts.selectionStart = ts.selectionEnd = ts.value.length; }); }
  var aib = document.getElementById("addItemBtn"); if(aib) aib.addEventListener("click", openAddItemModal);
  var atb = document.getElementById("addToolBtn"); if(atb) atb.addEventListener("click", openAddToolModal);
  document.querySelectorAll("[data-sklad]").forEach(function(b){ b.addEventListener("click", function(){ materialSklad=b.getAttribute("data-sklad"); renderView(); }); });
  document.querySelectorAll("[data-mcat]").forEach(function(b){ b.addEventListener("click", function(){ materialCat=b.getAttribute("data-mcat"); renderView(); }); });
  document.querySelectorAll("[data-tcat]").forEach(function(b){ b.addEventListener("click", function(){ toolCat=b.getAttribute("data-tcat"); renderView(); }); });
  document.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ historyTab=b.getAttribute("data-tab"); renderView(); }); });
}

function openBorrowModal(id){
  var t = toolById(id);
  openModal(
    '<h3 class="modal-title">Půjčit — '+esc(t.name)+'</h3>'+
    '<div class="field"><label>Komu</label><input id="bwWho" list="peopleList" value="'+esc(device.personName)+'"></div>'+
    peopleDatalist("peopleList")+
    '<div class="field"><label>Stavba / zakázka</label><select id="bwStavba">'+stavbaOptions()+'</select></div>'+
    '<div class="modal-actions"><button class="btn btn-primary btn-block" id="bwSave">Uložit půjčení</button></div>'
  );
  document.getElementById("bwSave").addEventListener("click", function(){
    var who = document.getElementById("bwWho").value.trim();
    if(!who){ alert("Zadej komu se nářadí půjčuje."); return; }
    var stId = document.getElementById("bwStavba").value;
    var btn = this; btn.disabled = true;
    var ref = dref("tools/"+t.id), logRef = F.doc(cref("toolLog"));
    if(state.people.indexOf(who)===-1) F.setDoc(dref("people/"+slug(who)), { name:who }).catch(function(){});
    withTimeout(F.runTransaction(fb.db, async function(tx){
      var s = await tx.get(ref);
      if(!s.exists()) throw { code:"gone" };
      var d = s.data();
      if(d.status==="out") throw { code:"taken", by:d.borrower };
      var ts = now();
      tx.update(ref, { status:"out", borrower:who, stavbaId:stId, since:ts });
      tx.set(logRef, { toolId:t.id, toolName:d.name, action:"borrow", personName:device.personName, borrower:who, stavbaId:stId, stavbaName:stavbaName(stId,""), ts:ts });
    }), 20000).then(function(){
      closeModal(); toast("Půjčeno: "+t.name+" → "+stavbaName(stId));
    }).catch(function(e){
      btn.disabled = false;
      if(e && e.code==="taken"){ closeModal(); toast("Mezitím si to půjčil(a): "+(e.by||"někdo jiný")+"."); }
      else if(e && e.code==="gone"){ closeModal(); toast("Tohle nářadí už v appce není."); }
      else toast(errText(e));
    });
  });
}
function openEditToolModal(id, presetNo){
  var t = id? toolById(id) : null;
  var cats = [];
  state.tools.forEach(function(x){ if(x.category && cats.indexOf(x.category)===-1) cats.push(x.category); });
  var nextNo = state.tools.reduce(function(m,x){ var n=parseInt(x.invNo,10); return isNaN(n)?m:Math.max(m,n); }, 1000) + 1;
  openModal(
    '<h3 class="modal-title">'+(t?"Upravit nářadí":"Nové nářadí")+'</h3>'+

    '<div class="modal-actions">'+(t?'<button class="btn btn-danger" id="tDelete">Smazat</button>':'')+'<button class="btn btn-primary" id="tSave">Uložit</button></div>'
  );
  document.getElementById("tSave").addEventListener("click", function(){

    else {
      if(state.tools.some(function(x){ return String(x.invNo)===String(no); })){ alert("Nářadí s tímto QR kódem už v appce je."); return; }
      p = F.setDoc(dref("tools/t"+slug(no)), { invNo:String(no), category:cat, name:name, status:"in", borrower:null, stavbaId:null, since:null });

    withTimeout(p, 20000).then(function(){ closeModal(); toast(t ? "Nářadí upraveno." : (presetNo ? "Přidáno – QR kód je teď spárovaný s: "+name : "Nářadí přidáno.")); }).catch(adminFail);

    if(!confirm("Opravdu smazat nářadí "+t.name+"?")) return;
    withTimeout(F.deleteDoc(dref("tools/"+t.id)), 20000).then(function(){ closeModal(); toast("Nářadí smazáno."); }).catch(adminFail);
  }); }
}

  document.getElementById("addStavbaBtn").addEventListener("click", function(){
    var v = document.getElementById("newStavba").value.trim();
    if(!v) return;
    var ex = state.stavby.find(function(s){ return s.name.toLowerCase()===v.toLowerCase(); });
    var p = ex ? F.updateDoc(dref("stavby/"+ex.id), { active:true }) : F.setDoc(F.doc(cref("stavby")), { name:v, active:true });
    withTimeout(p, 20000).then(function(){ closeModal(); openSettingsModal(); }).catch(adminFail);
  });
  document.getElementById("addPersonBtn").addEventListener("click", function(){
    var v = document.getElementById("newPersonSet").value.trim();
    if(!v) return;
    withTimeout(F.setDoc(dref("people/"+slug(v)), { name:v }), 20000).then(function(){ closeModal(); openSettingsModal(); }).catch(adminFail);
  });
  document.querySelectorAll("[data-rm-stavba]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-rm-stavba");
      withTimeout(F.updateDoc(dref("stavby/"+id), { active:false }), 20000).then(function(){ closeModal(); openSettingsModal(); }).catch(adminFail);
    });
  });
  document.querySelectorAll("[data-rm-person]").forEach(function(b){
    b.addEventListener("click", function(){
      var name = b.getAttribute("data-rm-person");
      withTimeout(F.deleteDoc(dref("people/"+slug(name))), 20000).then(function(){ closeModal(); openSettingsModal(); }).catch(adminFail);
    });
  });
}

/* ---------------- správce ---------------- */
function isAdmin(){ return !!device.admin; }
function requireAdmin(cb){
  if(isAdmin()){ cb(); return; }
  openModal(
    '<h3 class="modal-title">Jen pro správce</h3>'+
    '<div class="hint">Nastavení, přidávání, úpravy a mazání položek může dělat jen správce appky.</div>'+
    '<div class="field"><label>Kód správce</label><input id="admCode" type="password" inputmode="numeric" autocomplete="off"></div>'+
    '<div class="gate-error" id="admErr" style="margin:-4px 0 8px;"></div>'+
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Zrušit</button><button class="btn btn-primary" id="admOk">Odemknout</button></div>'
  );
  var go = function(){
    var code = document.getElementById("admCode").value.trim();
    var errEl = document.getElementById("admErr");
    if(!code) return;
    errEl.textContent = "Ověřuji…";
    tryAdmin(code).then(function(){
      device.admin = true; saveDevice(); closeModal(); render(); cb();
    }).catch(function(e){ errEl.textContent = isDenied(e) ? "Nesprávný kód správce." : errText(e); });
  };
  document.getElementById("admOk").addEventListener("click", go);
  document.getElementById("admCode").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
  setTimeout(function(){ var el=document.getElementById("admCode"); if(el) el.focus(); }, 50);
}

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 3200);
}

/* ---------------- QR scanner ---------------- */
var scan = { stream:null, raf:null, detector:null, canvas:null, busy:false, jsqrLoading:null };
function scMsg(text, isErr){ var m=document.getElementById("scMsg"); m.textContent=text; m.classList.toggle("err", !!isErr); }
function loadJsQR(){
  if(window.jsQR) return Promise.resolve(true);
  if(scan.jsqrLoading) return scan.jsqrLoading;
  scan.jsqrLoading = new Promise(function(res){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = function(){ res(!!window.jsQR); };
    s.onerror = function(){ scan.jsqrLoading = null; res(false); };
    document.head.appendChild(s);
  });
  return scan.jsqrLoading;
}
async function openScanner(){
  closeModal();
  document.getElementById("scanner").hidden = false;
  document.getElementById("scManual").value = "";
  scMsg("Spouštím kameru…");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    scMsg("Tady kamera nejde spustit. Zadej číslo z QR kódu ručně dole.", true); return;
  }
  try{
    if("BarcodeDetector" in window){
      try{
        var formats = await window.BarcodeDetector.getSupportedFormats();
        if(formats.indexOf("qr_code")>-1) scan.detector = new window.BarcodeDetector({formats:["qr_code"]});
      }catch(e){}
    }
    if(!scan.detector){
      var ok = await loadJsQR();
      if(!ok){ scMsg("Čtečku se nepodařilo načíst (chybí internet?). Zadej číslo z QR kódu ručně dole.", true); return; }
    }
    scan.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720} }, audio:false });
    if(document.getElementById("scanner").hidden){ stopCamera(); return; }
    var v = document.getElementById("scVideo");
    v.srcObject = scan.stream;
    await v.play();
    scMsg("Namiř kameru na QR kód na nářadí.");
    scan.busy = false;
    scanLoop();
  }catch(e){
    var denied = e && (e.name==="NotAllowedError" || e.name==="SecurityError");
    scMsg(denied ? "Appka nemá povolený přístup ke kameře. Povol kameru v prohlížeči, nebo zadej číslo ručně dole."
                 : "Kameru se nepodařilo spustit. Zadej číslo z QR kódu ručně dole.", true);
  }
}
function scanLoop(){
  scan.raf = requestAnimationFrame(async function(){
    var v = document.getElementById("scVideo");
    if(!scan.stream) return;
    if(!scan.busy && v.readyState >= 2 && v.videoWidth){
      scan.busy = true;
      try{
        var text = null;
        if(scan.detector){
          var codes = await scan.detector.detect(v);
          if(codes && codes.length) text = codes[0].rawValue;
        } else if(window.jsQR){
          var c = scan.canvas || (scan.canvas = document.createElement("canvas"));
          var w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
          c.width = w; c.height = h;
          var ctx = c.getContext("2d", {willReadFrequently:true});
          ctx.drawImage(v, 0, 0, w, h);
          var img = ctx.getImageData(0, 0, w, h);
          var r = window.jsQR(img.data, w, h, {inversionAttempts:"dontInvert"});
          if(r && r.data) text = r.data;
        }
        if(text){ handleCode(text); return; }
      }catch(e){}
      scan.busy = false;
    }
    scanLoop();
  });
}
function stopCamera(){
  if(scan.raf) cancelAnimationFrame(scan.raf);
  scan.raf = null;
  if(scan.stream){ scan.stream.getTracks().forEach(function(t){ t.stop(); }); }
  scan.stream = null;
  var v = document.getElementById("scVideo"); if(v) v.srcObject = null;
}
function closeScanner(){ stopCamera(); document.getElementById("scanner").hidden = true; }
function handleCode(text){
  var m = String(text).match(/\d+/);
  var code = m ? m[0] : String(text).trim();
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  closeScanner();
  var t = state.tools.find(function(x){ return String(x.invNo) === code; });
  activeView = "naradi"; render();
  if(t){ openToolDetail(t.id); return; }
  openModal(
    '<h3 class="modal-title">Tenhle kód appka nezná</h3>'+
    '<div class="hint">Naskenovaný kód: '+esc(code)+'</div>'+
    '<p style="font-size:14px; line-height:1.5; margin:0 0 14px;">Žádné nářadí v appce k tomuto QR kódu nepatří. Pokud je to nové nářadí, správce ho může rovnou přidat – kód se k němu uloží.</p>'+
    '<div class="modal-actions"><button class="btn btn-outline" id="ukAgain">Skenovat znovu</button><button class="btn btn-primary" id="ukAdd">Přidat nářadí</button></div>'
  );
  document.getElementById("ukAgain").addEventListener("click", openScanner);
  document.getElementById("ukAdd").addEventListener("click", function(){ requireAdmin(function(){ openEditToolModal(null, code); }); });
}
document.getElementById("scClose").addEventListener("click", closeScanner);
document.getElementById("scManualBtn").addEventListener("click", function(){
  var v = document.getElementById("scManual").value.trim(); if(v) handleCode(v);
});
document.getElementById("scManual").addEventListener("keydown", function(e){ if(e.key==="Enter"){ var v=e.target.value.trim(); if(v) handleCode(v); } });
document.addEventListener("visibilitychange", function(){ if(document.hidden && scan.stream) closeScanner(); });

render();
initFirebase();
})();
</script>
